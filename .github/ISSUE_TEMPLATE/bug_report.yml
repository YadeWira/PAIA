name: Bug report
description: Something PAIA did wrong, refused, or crashed on
title: "paia: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The quickest way to a fix is the output of
        `paia report FILE` (on the file it happened with): it has PAIA's build, the
        system and the file's structure, and **not** the pixels, its metadata
        contents or folder names. `paia report` prints a link that opens this form
        with the report filled in below.
  - type: textarea
    id: body
    attributes:
      label: The output of paia report
      description: Run `paia report FILE` (or `paia report` without a file) and paste all of it.
      render: text
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you ran
      description: The exact command line(s), and what it printed.
      placeholder: |
        paia a anim.gif
        paia: anim.gif: ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened instead.
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: The file (if you can share it)
      description: |
        `paia report --with-file FILE` puts a copy beside the report. GitHub takes a .gif
        as it is; zip a .jls, .mpo or .paia first. Only attach what you are free to share.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: "`paia selftest` passes on this machine (if it fails, say so above)"
          required: false
